name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: '--mac --arm64'
            artifact: 'mac-arm64'
            expected: 'release/Legal-Work-Space-1.0.0-mac-arm64.dmg'
          - os: macos-15-intel
            args: '--mac --x64'
            artifact: 'mac-x64'
            expected: 'release/Legal-Work-Space-1.0.0-mac-x64.dmg'
          - os: windows-latest
            args: '--win'
            artifact: 'win'
            expected: 'release/Legal-Work-Space-1.0.0-win-x64.exe'
          - os: ubuntu-latest
            args: '--linux'
            artifact: 'linux'
            expected: 'release/Legal-Work-Space-1.0.0-linux-x64.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.RELEASE_TAG!==expected){throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)}"

      - name: Build renderer
        run: npm run build

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Verify expected installer exists
        env:
          EXPECTED_INSTALLER: ${{ matrix.expected }}
        run: node -e "const fs=require('fs');if(!fs.existsSync(process.env.EXPECTED_INSTALLER)){throw new Error('Missing '+process.env.EXPECTED_INSTALLER)}"

      - name: Verify macOS installer integrity
        if: runner.os == 'macOS'
        env:
          EXPECTED_INSTALLER: ${{ matrix.expected }}
        shell: bash
        run: |
          hdiutil verify "$EXPECTED_INSTALLER"
          ZIP_PATH="${EXPECTED_INSTALLER%.dmg}.zip"
          unzip -t "$ZIP_PATH"
          APP_PLIST="$(find release -path '*/Legal Work Space.app/Contents/Info.plist' -print -quit)"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")" = "1.0.0"

      - name: Verify Windows installer integrity
        if: runner.os == 'Windows'
        env:
          EXPECTED_INSTALLER: ${{ matrix.expected }}
        shell: pwsh
        run: 7z t "$env:EXPECTED_INSTALLER"

      - name: Verify Linux AppImage integrity
        if: runner.os == 'Linux'
        env:
          EXPECTED_INSTALLER: ${{ matrix.expected }}
        shell: bash
        run: |
          chmod +x "$EXPECTED_INSTALLER"
          "$EXPECTED_INSTALLER" --appimage-extract >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-work-space-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: legal-work-space-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const expected = [
            'Legal-Work-Space-1.0.0-mac-arm64.dmg',
            'Legal-Work-Space-1.0.0-mac-x64.dmg',
            'Legal-Work-Space-1.0.0-win-x64.exe',
            'Legal-Work-Space-1.0.0-linux-x64.AppImage',
          ]
          const missing = expected.filter((name) => !fs.existsSync(`release-assets/${name}`))
          if (missing.length) throw new Error(`Missing release assets: ${missing.join(', ')}`)
          NODE
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --draft \
              --title "Legal Work Space v1.0.0" \
              --notes-file build/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" \
            --title "Legal Work Space v1.0.0" \
            --notes-file build/release-notes.md \
            --draft=false \
            --latest
