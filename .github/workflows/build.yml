name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: '--mac --arm64'
            artifact: 'mac-arm64'
          - os: macos-15-intel
            args: '--mac --x64'
            artifact: 'mac-x64'
          - os: windows-latest
            args: '--win'
            artifact: 'win'
          - os: ubuntu-latest
            args: '--linux'
            artifact: 'linux'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish onTag

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-work-space-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
