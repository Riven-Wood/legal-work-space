name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: '--mac --arm64'
            artifact: 'mac-arm64'
            suffix: 'mac-arm64.dmg'
          - os: macos-15-intel
            args: '--mac --x64'
            artifact: 'mac-x64'
            suffix: 'mac-x64.dmg'
          - os: windows-latest
            args: '--win --x64'
            artifact: 'win'
            suffix: 'win-x64.exe'
          - os: ubuntu-latest
            args: '--linux --x64'
            artifact: 'linux'
            suffix: 'linux-x64.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.RELEASE_TAG!==expected){throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)}"

      - name: Export package version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build renderer
        run: npm run build

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Verify expected installer exists
        env:
          EXPECTED_INSTALLER: release/Legal-Work-Space-${{ env.VERSION }}-${{ matrix.suffix }}
        run: node -e "const fs=require('fs');if(!fs.existsSync(process.env.EXPECTED_INSTALLER)){throw new Error('Missing '+process.env.EXPECTED_INSTALLER)}"

      - name: Verify macOS installer integrity
        if: runner.os == 'macOS'
        env:
          EXPECTED_INSTALLER: release/Legal-Work-Space-${{ env.VERSION }}-${{ matrix.suffix }}
        shell: bash
        run: |
          hdiutil verify "$EXPECTED_INSTALLER"
          ZIP_PATH="${EXPECTED_INSTALLER%.dmg}.zip"
          unzip -t "$ZIP_PATH"
          APP_PLIST="$(find release -path '*/Legal Work Space.app/Contents/Info.plist' -print -quit)"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")" = "$VERSION"

      - name: Verify Windows installer integrity
        if: runner.os == 'Windows'
        env:
          EXPECTED_INSTALLER: release/Legal-Work-Space-${{ env.VERSION }}-${{ matrix.suffix }}
        shell: pwsh
        run: 7z t "$env:EXPECTED_INSTALLER"

      - name: Verify Linux AppImage integrity
        if: runner.os == 'Linux'
        env:
          EXPECTED_INSTALLER: release/Legal-Work-Space-${{ env.VERSION }}-${{ matrix.suffix }}
        shell: bash
        run: |
          chmod +x "$EXPECTED_INSTALLER"
          "$EXPECTED_INSTALLER" --appimage-extract >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-work-space-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export package version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: legal-work-space-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const version = require('./package.json').version
          const expected = [
            `Legal-Work-Space-${version}-mac-arm64.dmg`,
            `Legal-Work-Space-${version}-mac-arm64.zip`,
            `Legal-Work-Space-${version}-mac-x64.dmg`,
            `Legal-Work-Space-${version}-mac-x64.zip`,
            `Legal-Work-Space-${version}-win-x64.exe`,
            `Legal-Work-Space-${version}-linux-x64.AppImage`,
          ].sort()
          const actual = fs.readdirSync('release-assets').sort()
          const missing = expected.filter((name) => !fs.existsSync(`release-assets/${name}`))
          if (missing.length) throw new Error(`Missing release assets: ${missing.join(', ')}`)
          const unexpected = actual.filter((name) => !expected.includes(name))
          if (unexpected.length) throw new Error(`Unexpected release assets: ${unexpected.join(', ')}`)
          NODE
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --draft \
              --title "Legal Work Space v$VERSION" \
              --notes-file build/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" \
            --title "Legal Work Space v$VERSION" \
            --notes-file build/release-notes.md \
            --draft=false \
            --latest
